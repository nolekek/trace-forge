[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TraceForge Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/traceforge/traceforge"

[workspace.dependencies]
# Internal workspace crates
traceforge-core = { path = "crates/traceforge-core" }
traceforge-proxy = { path = "crates/traceforge-proxy" }
traceforge-guard = { path = "crates/traceforge-guard" }
traceforge-storage = { path = "crates/traceforge-storage" }
traceforge-hitl = { path = "crates/traceforge-hitl" }
traceforge-ui = { path = "crates/traceforge-ui" }

# Async runtime & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "http1", "http2", "json", "matched-path", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls"] }
hyper = { version = "1.5", features = ["full"] }
http-body-util = "0.1"

# Serialization & Identifiers
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = { version = "1.1", features = ["serde"] }

# Byte & Stream utilities
bytes = "1.8"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
pin-project-lite = "0.2"

# Error Handling
thiserror = "2.0"

# CLI & Telemetry
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
